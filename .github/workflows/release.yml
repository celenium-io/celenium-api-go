name: Generate Celenium API

env:
  TAG: ${{ github.event.client_payload.tag || inputs.tag }}

on:
  repository_dispatch:
    types: [tag_created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Indexer tag, e.g. v1.19.9"
        required: true
        type: string

jobs:
  generate_api_job:
    name: Generate API & GitHub push
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    outputs:
      sha: ${{ steps.push.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete all files except .github/workflows and LICENSE
        run: |
          find . -mindepth 1 \
            -not -path './.git*' \
            -not -path './.github/workflows*' \
            -not -name 'LICENSE' \
            -exec rm -rf {} +

      - name: Generate API client
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/local openapitools/openapi-generator-cli generate \
            -i https://raw.githubusercontent.com/celenium-io/celestia-indexer/$TAG/cmd/api/docs/swagger.json \
            -g go \
            -p packageName=celenium --skip-validate-spec \
            -o /local --git-repo-id celenium-api-go --git-user-id celenium-io

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Commit and push changes
        id: push
        run: |
          git add .
          git diff --cached --quiet || git commit -m "$TAG"
          git push https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: generate_api_job
    runs-on: ubuntu-latest

    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          TARGET_SHA: ${{ needs.generate_api_job.outputs.sha }}
        run: |
          gh release create "$TAG" \
            -R "${{ github.repository }}" \
            --target "$TARGET_SHA" \
            --title "$TAG" \
            --generate-notes
